<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>The Judge — Pre-Submission Diagnostic</title>
  <meta name="description" content="The Judge: strict 4-phase pre-submission grading with high-contrast card alignment guides." />
  <link rel="stylesheet" href="/styles.css" />
  <!--
    High-contrast card alignment viewport (BusinessPlan.md Phase 2).
    The live camera + canvas overlay lives in #scanViewportTemplate and is
    cloned into the Scan view by public/app.js. Colors are intentionally
    neon-on-black so the frame stays readable on both dark tables and
    glossy holofoil cards. Layout uses flexbox + padding-bottom aspect
    ratio (no grid-template-areas) for Catalina-era Safari.
  -->
  <style>
    :root {
      --guide-cyan: #00f6ff;
      --guide-white: #ffffff;
      --guide-ok: #00ff88;
      --guide-warn: #ffb020;
      --guide-mask: rgba(0, 0, 0, 0.58);
    }
    .scan-viewport {
      position: relative;
      width: 100%;
      max-width: 560px;
      margin: 14px auto 0;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--guide-cyan);
      box-shadow: 0 0 0 1px #fff, 0 8px 28px rgba(0, 246, 255, 0.18);
    }
    .scan-viewport-stage {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 133.333%; /* 4:3 fallback for older Safari */
      background: #000;
    }
    @supports (aspect-ratio: 3 / 4) {
      .scan-viewport-stage {
        padding-bottom: 0;
        aspect-ratio: 3 / 4;
        height: auto;
      }
    }
    .scan-viewport-stage video,
    .scan-viewport-stage canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .scan-viewport-stage canvas {
      pointer-events: none;
    }
    .scan-viewport-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      z-index: 2;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 0.85rem;
      color: #fff;
      text-shadow: 0 1px 0 #000, 0 0 8px #000;
      pointer-events: none;
    }
    .scan-viewport-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background: #05080e;
      border-top: 1px solid rgba(0, 246, 255, 0.35);
    }
    .scan-viewport-actions .small {
      background: var(--guide-cyan);
      color: #012;
      border: 0;
      font-weight: 700;
      cursor: pointer;
    }
    .scan-viewport-actions .small.ghost {
      background: transparent;
      color: var(--guide-cyan);
      border: 1px solid var(--guide-cyan);
    }
    .scan-status {
      margin: 0;
      padding: 6px 10px 10px;
      color: var(--guide-cyan);
      font-size: 0.85rem;
    }
    .subgrade-pill {
      display: inline-block;
      margin: 2px 4px 2px 0;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--guide-cyan);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--guide-cyan);
    }
    .ceiling-flag {
      color: #ffb020;
      font-weight: 700;
    }
    .centering-diag {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 246, 255, 0.25);
    }
    .centering-diag .diag-hint {
      margin: 0 0 6px 0;
      font-weight: 700;
      color: var(--guide-cyan);
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5v14h18V5H3zm16 12H5V7h14v10z"/><path fill="currentColor" d="M7 9h10v2H7z"/></svg>
      <h1>The Judge</h1>
    </div>
    <nav class="top-nav" aria-label="Main">
      <button class="nav-btn" data-route="dashboard" aria-pressed="true">Dashboard</button>
      <button class="nav-btn" data-route="inventory">Wallet</button>
      <button class="nav-btn" data-route="scan">Scan Card</button>
    </nav>
    <div class="auth">
      <button id="loginBtn" class="small">Log in</button>
    </div>
  </header>

  <main id="app" class="app-root">
    <noscript>
      <section class="static-message">
        <h2>The Judge</h2>
        <p>JavaScript is required to access the interactive dashboard. Please enable JavaScript in your browser.</p>
      </section>
    </noscript>
  </main>

  <!--
    Scan viewport template (cloned by app.js into the Scan view).
    video  = live getUserMedia feed (environment camera preferred)
    canvas = high-contrast 2.5×3.5 card frame, L-brackets, 50/50 crosshair
    file   = fallback when getUserMedia is unavailable
  -->
  <template id="scanViewportTemplate">
    <div class="scan-viewport" id="scanViewport">
      <div class="scan-viewport-stage" id="scanStage">
        <video id="scanVideo" autoplay muted playsinline></video>
        <canvas id="scanGuideCanvas" aria-hidden="true"></canvas>
        <div class="scan-viewport-hint" id="scanHint">Align every border inside the neon frame</div>
      </div>
      <div class="scan-viewport-actions">
        <button type="button" id="startCameraBtn" class="small">Start Camera</button>
        <button type="button" id="captureBtn" class="small">Capture &amp; Grade</button>
        <button type="button" id="uploadInsteadBtn" class="small ghost">Upload Photo</button>
        <button type="button" id="stopCameraBtn" class="small ghost">Stop Camera</button>
      </div>
      <p class="scan-status" id="scanStatus" role="status">Start the camera, then hold the card flat in the frame.</p>
    </div>
  </template>

  <!-- Floating scan trigger (mobile-first) — routes into the guided viewport -->
  <input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none" />
  <button id="scanBtn" class="scan-btn" aria-label="Scan a new card">
    <svg viewBox="0 0 24 24" class="camera-icon" aria-hidden="true">
      <path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8-1h-2.2l-1.5-2H7.7L6.2 7H4a2 2 0 00-2 2v8a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
    </svg>
    Scan
  </button>

  <script src="/app.js" defer></script>
</body>
</html>
